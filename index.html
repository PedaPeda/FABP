<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FABP – Free All Bluetooth Printers</title>
<style>
/* VOICE: ruhig, praktisch
   IDEA: ein Thermopapier-Streifen, der aus dem Drucker kommt
   PICTURE: die gerasterte Vorschau als Papierstreifen mit Zackenrand
   COLOUR and TYPE: Papierweiß, Tinte schwarz, Akzent Pastellblau wie das Gerät
   LAYOUT: eine Spalte: Verbinden, Bild, Vorschau, Drucken */
:root{color-scheme:light dark;--bg:light-dark(#eef3f8,#12161b);--card:light-dark(#fff,#1c232b);--ink:light-dark(#111,#eef2f6);--mut:light-dark(#5b6672,#9aa6b2);--acc:#6f9fd8;--acc2:light-dark(#dbe8f7,#24364b);--ok:#1f9d55;--err:#d23b3b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 60px}
.top{display:flex;justify-content:flex-end}
.top select{width:auto;min-width:150px}
h1{font-size:32px;line-height:1.05;margin:10px 0 4px}
.tag{font-weight:600;color:var(--acc);margin:0 0 2px;letter-spacing:.01em}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 1px 3px #0001}
.card h2{font-size:17px;margin:0 0 10px}
button,.btn{appearance:none;border:0;border-radius:12px;min-height:46px;padding:0 18px;font:600 16px system-ui,sans-serif;cursor:pointer;background:var(--acc2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.pri{background:var(--acc);color:#fff}
button.stop{background:var(--err);color:#fff}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1}
#st{font-size:14px;color:var(--mut)}
#st b{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block;vertical-align:middle;margin-inline-end:6px}
.dot.on{background:var(--ok)}
input[type=file]{display:none}
label.f{display:grid;grid-template-columns:8em minmax(0,1fr) 3em;gap:10px;align-items:center;margin:8px 0;font-size:15px}
label.f output{text-align:end;font-variant-numeric:tabular-nums;color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--acc);height:32px}
input[type=number]{font-size:16px;min-height:40px;border-radius:10px;border:1px solid var(--acc2);background:var(--card);color:var(--ink);padding:0 10px;width:100%}
select{font-size:16px;min-height:40px;border-radius:10px;border:1px solid var(--acc2);background:var(--card);color:var(--ink);padding:0 8px;width:100%}
.chk{display:flex;gap:8px;align-items:center;font-size:15px;min-height:40px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.hint{font-size:13px;color:var(--mut);margin:-4px 0 6px}
#endBox{border-inline-start:3px solid var(--acc);padding-inline-start:12px;margin:4px 0 6px}
.paper{background:#fff;margin:6px auto 0;max-width:384px;padding:14px 0 18px;position:relative;filter:drop-shadow(0 3px 6px #0002)}
.paper::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(135deg,#fff 50%,transparent 50%) 0 0/12px 8px,linear-gradient(225deg,#fff 50%,transparent 50%) 0 0/12px 8px}
.paper.long{max-height:65vh;overflow-y:auto;filter:none;box-shadow:0 3px 8px #0002}
.paper.long::after{display:none}
#cv{display:block;width:100%;image-rendering:pixelated}
.empty{color:#888;text-align:center;padding:50px 16px;font-size:15px}
#sz{text-align:center;font-size:14px;color:var(--mut);margin:14px 0 0;font-variant-numeric:tabular-nums}
progress{width:100%;height:10px;accent-color:var(--acc);margin-top:10px}
#log{font:13px/1.4 ui-monospace,monospace;color:var(--mut);white-space:pre-wrap;max-height:120px;overflow:auto;margin:8px 0 0;direction:ltr;text-align:left}
.warn{background:#fff3cd;color:#5c4400;border-radius:12px;padding:12px;font-size:14px;margin:0 0 14px}
.foot{text-align:center;font-size:14px;color:var(--mut);margin:26px 0 0}
.foot a{color:var(--acc);font-weight:600;text-decoration:none}
.foot a:hover{text-decoration:underline}
details summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center}
@media(prefers-reduced-motion:no-preference){.paper.go{animation:out .6s ease-out}@keyframes out{from{transform:translateY(-14px);opacity:.4}}}
</style>
</head>
<body>
<main>
<div class="top"><select id="lang" aria-label="Language">
<option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option><option value="fr">Français</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ru">Русский</option><option value="zh">中文</option><option value="ja">日本語</option><option value="ar">العربية</option>
</select></div>
<h1 data-i="title"></h1>
<p class="tag">Free All Bluetooth Printers</p>
<p class="sub" data-i="sub"></p>
<div id="nobt" class="warn" data-i="nobt" hidden></div>

<section class="card">
<h2 data-i="h1c"></h2>
<div class="row">
<button id="bCon" class="pri"></button>
<span id="st" class="grow"><span id="dot" class="dot"></span><span id="stt"></span> <b id="stn"></b></span>
</div>
</section>

<section class="card">
<h2 data-i="h2"></h2>
<div class="row">
<label class="btn" for="file" data-i="pick" tabindex="0"></label>
<input id="file" type="file" accept="image/*">
<button id="bRot" data-i="rot"></button>
</div>
<label class="f"><span data-i="br"></span><input id="br" type="range" min="-100" max="100" value="20"><output id="obr">20</output></label>
<label class="f"><span data-i="ct"></span><input id="ct" type="range" min="-100" max="100" value="10"><output id="oct">10</output></label>
<label class="f"><span data-i="dm"></span><select id="dm"><option value="fs" data-i="fs"></option><option value="at" data-i="at"></option><option value="th" data-i="th"></option></select><span></span></label>
<label class="chk"><input id="inv" type="checkbox"> <span data-i="inv"></span></label>
<label class="chk"><input id="endless" type="checkbox"> <b data-i="end"></b></label>
<div id="endBox" hidden>
<label class="f"><span data-i="len"></span><input id="len" type="number" min="0" max="400" step="1" value="0" inputmode="numeric"><span>cm</span></label>
<p class="hint" data-i="lenh"></p>
</div>
</section>

<section class="card">
<h2 data-i="h3"></h2>
<div id="paper" class="paper" dir="ltr"><canvas id="cv" width="384" height="0"></canvas><div id="empty" class="empty" data-i="emp"></div></div>
<p id="sz" hidden></p>
</section>

<section class="card">
<h2 data-i="h4"></h2>
<label class="f"><span data-i="en"></span><input id="en" type="range" min="5" max="70" value="25"><output id="oen">25</output></label>
<label class="f"><span data-i="cp"></span><input id="cp" type="range" min="1" max="10" value="1"><output id="ocp">1</output></label>
<div class="row"><button id="bPr" class="pri grow" disabled></button><button id="bFeed" data-i="feed" disabled></button></div>
<progress id="pg" value="0" max="1" hidden></progress>
<details><summary data-i="adv"></summary>
<label class="f"><span data-i="pw"></span><select id="pw"><option value="384">384 (X6, 58 mm)</option><option value="576">576 (80 mm)</option></select><span></span></label>
<label class="f"><span data-i="sp"></span><input id="sp" type="range" min="10" max="60" value="32"><output id="osp">32</output></label>
<label class="f"><span data-i="dl"></span><input id="dl" type="range" min="0" max="40" value="8"><output id="odl">8</output></label>
<label class="f"><span data-i="ck"></span><input id="ck" type="range" min="20" max="240" step="4" value="120"><output id="ock">120</output></label>
<p class="hint" data-i="help"></p>
<div id="log"></div>
</details>
</section>
<p class="foot" dir="ltr" lang="en">If FABP helped you, feel free to <a href="https://www.paypal.me/pedapedapeda" target="_blank" rel="noopener">buy me a coffee ☕</a></p>
</main>

/* ---- Sprache ---- */
function setLang(k){
  t=L[k]||L.en;$('lang').value=L[k]?k:'en';
  document.documentElement.lang=$('lang').value;
  document.documentElement.dir=$('lang').value==='ar'?'rtl':'ltr';
  document.title='FABP – Free All Bluetooth Printers';
  for(const el of document.querySelectorAll('[data-i]'))el.textContent=t[el.dataset.i];
  try{localStorage.setItem('fabp-lang',$('lang').value)}catch{}
  ui();
}
function ui(){
  const on=!!dev?.gatt?.connected&&!!ch;
  $('dot').className='dot'+(on?' on':'');
  $('stt').textContent=t[conSt];
  $('stn').textContent=on?(dev.name||''):'';
  $('bCon').textContent=on?t.dis:t.con;
  $('bFeed').disabled=!on||busy;
  $('bPr').disabled=!(ch&&bits);
  $('bPr').textContent=busy?t.stop:t.pr;
  $('bPr').className=(busy?'stop':'pri')+' grow';
  $('sz').hidden=!bits;
  if(bits)$('sz').textContent=t.sz.replace('{n}',(H/80).toFixed(1));
}
if(!navigator.bluetooth)$('nobt').hidden=false;

/* ---- Protokoll ("Cat Printer", z. B. Mafiti X6 / Tiny Print) ---- */
const T=new Uint8Array(256);
for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=c&0x80?((c<<1)^0x07)&255:(c<<1)&255;T[i]=c}
const crc=d=>{let c=0;for(const b of d)c=T[(c^b)&255];return c};
const le16=v=>[v&255,(v>>8)&255];
function pkt(cmd,data){
  const d=Uint8Array.from(data),p=new Uint8Array(d.length+8);
  p[0]=0x51;p[1]=0x78;p[2]=cmd;p[3]=0;p[4]=d.length&255;p[5]=d.length>>8;
  p.set(d,6);p[6+d.length]=crc(d);p[7+d.length]=0xff;return p;
}
const C={
  state:()=>pkt(0xa3,[0]),dpi200:()=>pkt(0xa4,[50]),speed:v=>pkt(0xbd,[v]),
  energy:v=>pkt(0xaf,le16(v)),apply:()=>pkt(0xbe,[1]),update:()=>pkt(0xa9,[0]),
  latStart:()=>pkt(0xa6,[0xaa,0x55,0x17,0x38,0x44,0x5f,0x5f,0x5f,0x44,0x38,0x2c]),
  latEnd:()=>pkt(0xa6,[0xaa,0x55,0x17,0,0,0,0,0,0,0,0x17]),
  feed:n=>pkt(0xa1,le16(n)),line:b=>pkt(0xa2,b)
};
const join=arr=>{let n=0;for(const a of arr)n+=a.length;const o=new Uint8Array(n);let i=0;for(const a of arr){o.set(a,i);i+=a.length}return o};

/* ---- Verbinden ---- */
async function connect(){
  if(dev?.gatt?.connected){dev.gatt.disconnect();return}
  if(!navigator.bluetooth){$('nobt').hidden=false;return}
  try{
    dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[0xae30,0xaf30]});
    dev.addEventListener('gattserverdisconnected',()=>{ch=null;conSt='nc';cancel=true;ui();log('Disconnected')});
    conSt='cing';ui();
    const g=await dev.gatt.connect();
    let s;try{s=await g.getPrimaryService(0xae30)}catch{s=await g.getPrimaryService(0xaf30)}
    ch=await s.getCharacteristic(0xae01);
    wnr=!!ch.properties.writeWithoutResponse;
    try{
      const n=await s.getCharacteristic(0xae02);await n.startNotifications();
      n.addEventListener('characteristicvaluechanged',e=>{
        const v=new Uint8Array(e.target.value.buffer);
        if(v[2]===0xae){paused=v[6]===0x10}
        else if(v[2]===0xa3&&v[6])log('Status: '+v[6]+(v[6]&1?' (no paper?)':'')+(v[6]&2?' (lid open?)':'')+(v[6]&4?' (overheat?)':''));
      });
    }catch{log('No notifications')}
    conSt='cd';ui();log('Connected: '+(dev.name||'device'));
    await send(C.state());
  }catch(e){
    ch=null;conSt=(/cancel/i.test(e.message)||e.name==='NotFoundError')?'nc':'cf';ui();log('Error: '+e.message);
  }
}
async function send(bytes){
  const cs=+$('ck').value,dl=+$('dl').value;
  for(let o=0;o<bytes.length;o+=cs){
    while(paused&&ch)await sleep(30);
    if(!ch)throw new Error('not connected');
    const part=bytes.subarray(o,o+cs);
    if(wnr)await ch.writeValueWithoutResponse(part);else await ch.writeValue(part);
    if(dl)await sleep(dl);
  }
}

/* ---- Bild aufbereiten ---- */
function autoRot(){if(img)rot=endless()?(img.width>img.height?90:0):(img.width>img.height*1.2?90:0)}
function render(){
  const w=W(),c=$('cv'),x=c.getContext('2d',{willReadFrequently:true});
  $('paper').classList.toggle('long',endless());
  if(!img){c.height=0;bits=null;$('empty').hidden=false;ui();return}
  $('empty').hidden=true;
  const r=rot%180!==0,iw=r?img.height:img.width,ih=r?img.width:img.height;
  let s=w/iw;
  const lenPx=Math.min(MAXPX,Math.max(0,+$('len').value||0)*80); // 8 px/mm
  if(endless()&&lenPx)s=Math.min(lenPx/ih,w/iw);
  if(ih*s>MAXPX)s=MAXPX/ih;
  const h=Math.max(1,Math.round(ih*s));
  c.width=w;c.height=h;
  x.fillStyle='#fff';x.fillRect(0,0,w,h);
  x.imageSmoothingQuality='high';
  x.save();x.translate(w/2,h/2);x.rotate(rot*Math.PI/180);x.scale(s,s);x.drawImage(img,-img.width/2,-img.height/2);x.restore();
  const id=x.getImageData(0,0,w,h),p=id.data,g=new Float32Array(w*h);
  const b=+$('br').value*1.28,k0=+$('ct').value*1.28,k=(259*(k0+255))/(255*(259-k0)),inv=$('inv').checked;
  for(let i=0;i<w*h;i++){
    const a=p[i*4+3]/255;let l=0.299*p[i*4]+0.587*p[i*4+1]+0.114*p[i*4+2];
    l=255-(255-l)*a;l=(l-128)*k+128+b;if(inv)l=255-l;g[i]=l;
  }
  const m=$('dm').value;bits=new Uint8Array(w*h);
  const add=(xx,yy,v)=>{if(xx>=0&&xx<w&&yy<h)g[yy*w+xx]+=v};
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){
    const i=y*w+xx,o=g[i],n=o<128?0:255,e=o-n;bits[i]=n?0:1;
    if(m==='fs'){add(xx+1,y,e*7/16);add(xx-1,y+1,e*3/16);add(xx,y+1,e*5/16);add(xx+1,y+1,e/16)}
    else if(m==='at'){const f=e/8;add(xx+1,y,f);add(xx+2,y,f);add(xx-1,y+1,f);add(xx,y+1,f);add(xx+1,y+1,f);add(xx,y+2,f)}
  }
  for(let i=0;i<w*h;i++){const v=bits[i]?0:255;p[i*4]=p[i*4+1]=p[i*4+2]=v;p[i*4+3]=255}
  x.putImageData(id,0,0);H=h;ui();
}

/* ---- Drucken (gestreamt, auch für sehr lange Banner) ---- */
function lineAt(y,w){
  const line=new Uint8Array(w/8),o=y*w;
  for(let xx=0;xx<w;xx++)if(bits[o+xx])line[xx>>3]|=1<<(xx&7); // LSB = linkes Pixel
  return C.line(line);
}
async function print(){
  if(busy){cancel=true;return}
  if(!ch||!bits)return;
  busy=true;cancel=false;ui();
  const pg=$('pg');pg.hidden=false;pg.value=0;
  const w=W(),copies=+$('cp').value,en=Math.round(+$('en').value/100*0xffff),end=endless(),BATCH=32;
  const head=()=>join([C.state(),C.dpi200(),C.speed(+$('sp').value),C.energy(en),C.apply(),C.update(),C.latStart()]);
  const foot=()=>join([C.latEnd(),C.speed(8),C.feed(90),C.state()]);
  let open=false;
  try{
    for(let n=0;n<copies&&!cancel;n++){
      if(!open){await send(head());open=true}
      log(`Printing ${n+1}/${copies} (${(H/80).toFixed(1)} cm)`);
      for(let y=0;y<H&&!cancel;y+=BATCH){
        const parts=[];for(let yy=y;yy<Math.min(H,y+BATCH);yy++)parts.push(lineAt(yy,w));
        await send(join(parts));
        pg.value=(n*H+Math.min(H,y+BATCH))/(copies*H);
      }
      if(!end||n===copies-1){await send(foot());open=false}
    }
    if(open&&ch)await send(foot());
    log(cancel?'Stopped':'Done');
    $('paper').classList.remove('go');void $('paper').offsetWidth;$('paper').classList.add('go');
  }catch(e){log('Print error: '+e.message)}
  busy=false;pg.hidden=true;ui();
}

/* ---- Bedienung ---- */
$('lang').onchange=e=>setLang(e.target.value);
$('bCon').onclick=connect;
$('bPr').onclick=print;
$('bFeed').onclick=()=>send(join([C.speed(8),C.feed(60)])).catch(e=>log(e.message));
$('bRot').onclick=()=>{rot=(rot+(endless()?180:90))%360;render()};
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{img=i;autoRot();render()};
  i.onerror=()=>log('Could not load image');i.src=u;
};
document.querySelector('label[for=file]').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
$('endless').onchange=()=>{$('endBox').hidden=!endless();autoRot();render()};
let lt;$('len').oninput=()=>{clearTimeout(lt);lt=setTimeout(render,400)};
for(const [id,re] of [['br',1],['ct',1],['en',0],['cp',0],['sp',0],['dl',0],['ck',0]]){
  const el=$(id),o=$('o'+id);el.oninput=()=>{o.textContent=el.value;if(re)render()};
}
$('dm').onchange=render;$('inv').onchange=render;$('pw').onchange=render;
let saved=null;try{saved=localStorage.getItem('fabp-lang')}catch{}
setLang(saved||'en');
}
</script>
</body>
</html>
